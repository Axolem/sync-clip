name: Relay Docker

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - crates/clip-engine/**
      - crates/clip-ffi/**
      - crates/relay/**
      - .github/workflows/relay-docker.yml
      - docker-compose.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - crates/clip-engine/**
      - crates/clip-ffi/**
      - crates/relay/**
      - .github/workflows/relay-docker.yml
      - docker-compose.yml
  workflow_dispatch:

concurrency:
  group: relay-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  relay-image:
    name: Build relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/relay" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
