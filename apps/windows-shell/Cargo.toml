[package]
name = "windows-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows Shell for Sync Clip (tray + clipboard sync via clip-ffi Session)"
publish = false

[[bin]]
name = "sync-clip-shell"
path = "src/main.rs"

[dependencies]
clip-ffi = { path = "../../crates/clip-ffi" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
tao = "0.30"
tray-icon = "0.19"

[dev-dependencies]
tempfile = "3"
