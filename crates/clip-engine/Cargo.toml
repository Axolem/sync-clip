[package]
name = "clip-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Clip Engine: Clip model, encryption, sync protocol, Armed/Paused rules"
publish = false

[lib]
name = "clip_engine"
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ciborium = "0.2"
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
relay = { path = "../relay" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.26"
