[package]
name = "clip-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Clip Engine: Clip model, encryption, sync protocol, Armed/Paused rules"
publish = false

[lib]
name = "clip_engine"
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ciborium = "0.2"
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# rustls so wss:// works in Shell FFI (macOS staticlib + Android cdylib) without OpenSSL.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
relay = { path = "../relay" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
