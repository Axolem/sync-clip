[package]
name = "clip-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blocking Session facade over the Clip Engine for native Shell FFI"
publish = false

[lib]
name = "clip_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
clip-engine = { path = "../clip-engine" }
data-encoding = "2"
hex = "0.4"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
relay = { path = "../relay" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
